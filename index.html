<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImageTool - AI Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary-50: #eff6ff;
      --primary-100: #dbeafe;
      --primary-500: #3b82f6;
      --primary-600: #2563eb;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      overflow-x: hidden;
    }

    /* Force crisp vector rendering across all form elements */
    button, input, select, textarea, label, span, p, h1, h2, h3, h4, h5, h6 {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
    }

    /* Modern Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
      transition: background 0.3s;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* --- NEW ADVANCED ANIMATIONS --- */

    /* Moving Gradient Background */
    @keyframes gradient-x {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .animate-gradient-x {
      background-size: 200% 200%;
      animation: gradient-x 6s ease infinite;
    }

    /* Disabled blurry animated flow */
    .animate-gradient-flow {
      display: none !important;
    }

    /* Fast Gradient Text */
    @keyframes text-shimmer {
      0% {
        background-position: -200% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    .animate-text-shimmer {
      background-size: 200% auto;
      animation: text-shimmer 3s linear infinite;
    }

    /* Floating Elements */
    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .animate-float {
      animation: float 6s ease-in-out infinite;
    }

    /* Shine Effect for Glass */
    @keyframes shine {
      0% {
        left: -100%;
        opacity: 0;
      }

      20% {
        opacity: 0.5;
      }

      100% {
        left: 100%;
        opacity: 0;
      }
    }

    .animate-shine {
      position: relative;
      overflow: hidden;
    }

    .animate-shine::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: skewX(-25deg);
      animation: shine 3s infinite;
    }

    /* Pulse Glow */
    @keyframes pulse-glow {

      0%,
      100% {
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
      }

      50% {
        box-shadow: 0 0 30px rgba(99, 102, 241, 0.6);
      }
    }

    .animate-pulse-glow {
      animation: pulse-glow 3s infinite;
    }

    /* Marquee Animation - Continuous scrolling */
    @keyframes marquee {
      0% {
        transform: translateX(0%);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .animate-marquee {
      animation: marquee 20s linear infinite;
      animation-play-state: running !important;
      white-space: nowrap;
      display: flex;
      width: max-content;
      will-change: transform;
    }

    /* Ensure animation runs even when tab is inactive */
    .animate-marquee:hover {
      animation-play-state: running;
    }

    /* LED / Neon Effects - Crisp Clean */
    .neon-border {
      box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }

    .led-text {
      text-shadow: none;
    }

    /* Existing Animations */
    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .animate-fade-in {
      animation: fade-in-up 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes spin-slow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin-slow {
      animation: spin-slow 8s linear infinite;
    }

    @keyframes clock-hand {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .animate-clock-hour {
      animation: clock-hand 12s linear infinite;
    }

    .animate-clock-minute {
      animation: clock-hand 2s linear infinite;
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    .animate-shimmer {
      animation: shimmer 2s infinite;
    }

    /* Utilities */
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .toggle-checkbox:checked {
      right: 0;
      border-color: #4f46e5;
    }

    .toggle-checkbox:checked+.toggle-label {
      background-color: #4f46e5;
    }

    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }
  </style>
