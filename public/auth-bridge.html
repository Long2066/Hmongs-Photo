<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Google - ImageTool</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }
    h2 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #e0e7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin: 0 0 28px;
    }
    .status-box {
      padding: 16px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: #ffffff;
      color: #0f172a;
      font-weight: 700;
      font-size: 15px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .btn:hover {
      background: #f1f5f9;
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .success-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
    }
    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon.png" alt="Logo" class="logo" onerror="this.style.display='none'">
    <div class="badge">Xác thực Google an toàn</div>
    <h2>ImageTool AI Studio</h2>
    <p class="subtitle">Đăng nhập tài khoản Google qua trình duyệt Chrome</p>
    
    <div id="status-container" class="status-box">
      <span class="spinner"></span>
      <span id="status-text">Đang chuyển hướng sang Google...</span>
    </div>

    <button id="signin-btn" class="btn" style="display: none;">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Bấm để đăng nhập bằng Google
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithRedirect, 
      getRedirectResult, 
      signInWithPopup, 
      GoogleAuthProvider 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAUFQb3vsZPVv6i5smRTeXJkVYZuJGoQZE",
      authDomain: "toolphoto-2025.firebaseapp.com",
      projectId: "toolphoto-2025",
      storageBucket: "toolphoto-2025.firebasestorage.app",
      messagingSenderId: "820992304466",
      appId: "1:820992304466:web:6400056a3bf60d747a868b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const signinBtn = document.getElementById('signin-btn');
    const statusBox = document.getElementById('status-container');

    async function sendAuthSuccessToElectron(user, credential) {
      statusBox.innerHTML = '<span class="spinner"></span><span>Đăng nhập thành công! Đang chuyển tiếp về ImageTool...</span>';
      signinBtn.style.display = 'none';

      const payload = {
        uid: user.uid,
        email: user.email || '',
        displayName: user.displayName || user.email?.split('@')[0] || 'User',
        photoURL: user.photoURL || '',
        idToken: credential?.idToken || (await user.getIdToken()),
        accessToken: credential?.accessToken || ''
      };

      try {
        const response = await fetch('/api/auth-complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          statusBox.innerHTML = '<div class="success-icon">✓</div><strong style="color: #10b981; font-size: 16px;">Đăng nhập thành công!</strong><br><span style="color: #94a3b8; font-size: 13px;">Hệ thống đã nhận diện tài khoản: <strong>' + (user.email || '') + '</strong>.<br>ImageTool đang tự động đăng nhập. Tab này sẽ tự đóng sau 2 giây...</span>';
          setTimeout(() => { try { window.close(); } catch(e){} }, 2000);
        } else {
          statusBox.innerHTML = '<span style="color: #ef4444;">Không thể gửi xác thực về ImageTool. Vui lòng bấm thử lại bên dưới.</span>';
          signinBtn.style.display = 'inline-flex';
        }
      } catch (err) {
        console.error('Error posting auth to Electron:', err);
        statusBox.innerHTML = '<span style="color: #ef4444;">Lỗi kết nối về ImageTool: ' + (err.message || '') + '</span>';
        signinBtn.style.display = 'inline-flex';
      }
    }

    async function triggerRedirect() {
      try {
        statusBox.innerHTML = '<span class="spinner"></span><span>Đang chuyển hướng sang trang đăng nhập Google...</span>';
        signinBtn.style.display = 'none';
        sessionStorage.setItem('auth_redirect_in_progress', '1');
        await signInWithRedirect(auth, provider);
      } catch (err) {
        console.error('Redirect error:', err);
        sessionStorage.removeItem('auth_redirect_in_progress');
        statusBox.innerHTML = '<span style="color: #ef4444;">Lỗi chuyển hướng: ' + (err.message || 'Không thể chuyển hướng') + '</span>';
        signinBtn.style.display = 'inline-flex';
      }
    }

    async function handleManualSignIn() {
      try {
        statusBox.innerHTML = '<span class="spinner"></span><span>Đang kết nối Google...</span>';
        signinBtn.style.display = 'none';
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        await sendAuthSuccessToElectron(result.user, credential);
      } catch (popupErr) {
        console.warn('Popup failed, falling back to redirect:', popupErr);
        await triggerRedirect();
      }
    }

    signinBtn.addEventListener('click', handleManualSignIn);

    async function init() {
      try {
        const wasRedirecting = sessionStorage.getItem('auth_redirect_in_progress') === '1';

        // Check if returning from Google redirect
        const result = await getRedirectResult(auth);
        if (result && result.user) {
          sessionStorage.removeItem('auth_redirect_in_progress');
          const credential = GoogleAuthProvider.credentialFromResult(result);
          await sendAuthSuccessToElectron(result.user, credential);
          return;
        }

        if (wasRedirecting) {
          // Returning from redirect but no user returned
          sessionStorage.removeItem('auth_redirect_in_progress');
          statusBox.innerHTML = '<span style="color: #f59e0b;">Chưa hoàn tất đăng nhập. Vui lòng bấm nút bên dưới để thử lại:</span>';
          signinBtn.style.display = 'inline-flex';
          return;
        }

        // Fresh visit: directly redirect to Google without popup blocking!
        await triggerRedirect();
      } catch (err) {
        console.error('Auth redirect error:', err);
        sessionStorage.removeItem('auth_redirect_in_progress');
        statusBox.innerHTML = '<span style="color: #ef4444;">Lỗi: ' + (err.message || 'Đăng nhập thất bại') + '</span>';
        signinBtn.style.display = 'inline-flex';
      }
    }

    init();
  </script>
</body>
</html>
