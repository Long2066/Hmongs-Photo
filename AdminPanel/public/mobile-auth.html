<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đăng nhập Google - ImageTool</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #312e81 0%, #0f172a 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.65);
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.45);
      object-fit: contain;
      background: #ffffff;
      padding: 4px;
    }
    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(165, 180, 252, 0.35);
      color: #c7d2fe;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
    }
    h2 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin: 0 0 24px;
    }
    .status-box {
      padding: 16px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13.5px;
      line-height: 1.6;
      margin-bottom: 20px;
      word-break: break-word;
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(99, 102, 241, 0.25);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      padding: 12px 20px;
      background: #ffffff;
      color: #0f172a;
      font-weight: 700;
      font-size: 14.5px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      margin-bottom: 10px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #9333ea);
      color: #ffffff;
    }
    .success-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
      margin: 0 auto 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon.png" alt="ImageTool" class="logo" onerror="this.style.display='none'">
    <div class="badge">Xác thực Google Android</div>
    <h2>ImageTool AI Studio</h2>
    <p class="subtitle">Đăng nhập tài khoản Google an toàn</p>

    <div id="status-container" class="status-box">
      <span class="spinner"></span>
      <span id="status-text">Đang kết nối Google...</span>
    </div>

    <button id="signin-btn" class="btn" style="display: none;">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Tiếp tục với Google</span>
    </button>

    <a id="return-btn" href="#" class="btn btn-primary" style="display: none;">
      Mở lại ứng dụng ImageTool
    </a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      signInWithRedirect,
      getRedirectResult,
      signInWithPopup,
      GoogleAuthProvider,
      browserLocalPersistence,
      setPersistence
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // IMPORTANT: authDomain uses toolphoto-2025.web.app (same origin as this page!)
    // so Chrome/Android never partitions sessionStorage during OAuth redirect.
    const firebaseConfig = {
      apiKey: "AIzaSyAUFQb3vsZPVv6i5smRTeXJkVYZuJGoQZE",
      authDomain: "toolphoto-2025.web.app",
      projectId: "toolphoto-2025",
      storageBucket: "toolphoto-2025.firebasestorage.app",
      messagingSenderId: "820992304466",
      appId: "1:820992304466:web:6400056a3bf60d747a868b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    await setPersistence(auth, browserLocalPersistence).catch(() => {});

    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const signinBtn = document.getElementById('signin-btn');
    const returnBtn = document.getElementById('return-btn');
    const statusBox = document.getElementById('status-container');

    function returnToAndroidApp(user, credential) {
      const idToken = credential?.idToken || '';
      const accessToken = credential?.accessToken || '';

      if (!idToken && !accessToken) {
        statusBox.innerHTML = '<span style="color: #f87171;">Không lấy được mã xác thực Google. Vui lòng thử lại:</span>';
        signinBtn.style.display = 'inline-flex';
        return;
      }

      const params = new URLSearchParams();
      if (idToken) params.set('idToken', idToken);
      if (accessToken) params.set('accessToken', accessToken);
      params.set('uid', user.uid || '');
      params.set('email', user.email || '');
      params.set('displayName', user.displayName || user.email?.split('@')[0] || 'User');
      params.set('photoURL', user.photoURL || '');

      const deepLink = `com.toolphoto.app://auth-callback#${params.toString()}`;

      statusBox.innerHTML = `
        <div class="success-icon">✓</div>
        <strong style="color: #34d399; font-size: 16px;">Xác thực thành công!</strong><br>
        <span style="color: #cbd5e1; font-size: 13px;">Tài khoản: <strong>${user.email || ''}</strong><br>Đang tự động quay lại ImageTool...</span>
      `;
      signinBtn.style.display = 'none';
      returnBtn.href = deepLink;
      returnBtn.style.display = 'inline-flex';

      // Trigger deep link redirect immediately
      window.location.href = deepLink;
    }

    async function startRedirectLogin() {
      try {
        statusBox.innerHTML = '<span class="spinner"></span><span>Đang mở trang đăng nhập Google...</span>';
        signinBtn.style.display = 'none';
        sessionStorage.setItem('mobile_auth_redirecting', '1');
        await signInWithRedirect(auth, provider);
      } catch (err) {
        console.error('Redirect error:', err);
        sessionStorage.removeItem('mobile_auth_redirecting');
        statusBox.innerHTML = '<span style="color: #f87171;">Lỗi chuyển hướng: ' + (err.message || '') + '</span>';
        signinBtn.style.display = 'inline-flex';
      }
    }

    signinBtn.addEventListener('click', async () => {
      try {
        statusBox.innerHTML = '<span class="spinner"></span><span>Đang kết nối Google...</span>';
        signinBtn.style.display = 'none';
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        returnToAndroidApp(result.user, credential);
      } catch (popupErr) {
        console.warn('Popup fallback to redirect:', popupErr);
        await startRedirectLogin();
      }
    });

    async function init() {
      try {
        const wasRedirecting = sessionStorage.getItem('mobile_auth_redirecting') === '1';
        const result = await getRedirectResult(auth);

        if (result && result.user) {
          sessionStorage.removeItem('mobile_auth_redirecting');
          const credential = GoogleAuthProvider.credentialFromResult(result);
          returnToAndroidApp(result.user, credential);
          return;
        }

        if (wasRedirecting) {
          sessionStorage.removeItem('mobile_auth_redirecting');
          statusBox.innerHTML = '<span style="color: #fbbf24;">Chưa nhận được kết quả đăng nhập. Vui lòng bấm nút bên dưới:</span>';
          signinBtn.style.display = 'inline-flex';
          return;
        }

        // First open: automatically redirect on same-origin (toolphoto-2025.web.app)
        await startRedirectLogin();
      } catch (err) {
        console.error('Mobile auth init error:', err);
        sessionStorage.removeItem('mobile_auth_redirecting');
        statusBox.innerHTML = '<span style="color: #f87171;">Lỗi xác thực: ' + (err.message || 'Vui lòng thử lại') + '</span>';
        signinBtn.style.display = 'inline-flex';
      }
    }

    init();
  </script>
</body>
</html>
